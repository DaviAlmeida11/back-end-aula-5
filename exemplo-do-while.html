<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do while</title>
</head>
<body>
    <h1>exemploprético - do while</h1>
    <p>Exibindo números de 209 a 401 no console</p>
    <script>
        //declarando e inicializando o do while
        let i = 299
        do{
            console.log(`Número:  ${i}`)
            i++
        }while (i<=401)
    </script>
</body>
</html>
