<!DOCTYPE html>
<html lang="pt=br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while</title>
</head>
<body>
    <h1>Número de 10 a 200</h1>
    <script>
           let i = 200


     while(i>=10){
       console.log(`A ordem do Número :  ${i}`)
       i--
     }
     


          
    </script>
</body>
</html>
